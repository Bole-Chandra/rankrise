    <!--

    <!--
      Google Tag Manager (container script). Configure client/.env's
      VITE_GTM_ID to turn this on — quietly does nothing if it's unset.
      NOTE: GA4, Google Ads, and Meta Pixel are already fired directly above
      and in src/config/tracking.js — don't also add those inside the GTM
      container's own UI, or every event will be counted twice.
    -->
    <script>
      (function () {
        var GTM_ID = "%VITE_GTM_ID%";
        if (!GTM_ID || GTM_ID.indexOf('%') === 0 || GTM_ID.length < 4) return;

        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });

        var f = document.getElementsByTagName('script')[0];
        var j = document.createElement('script');
        j.async = true;
        j.src = 'https://www.googletagmanager.com/gtm.js?id=' + GTM_ID;
        f.parentNode.insertBefore(j, f);
      })();
    </script>

    <!--
      Google tag (gtag.js) — powers BOTH Google Analytics 4 and Google Ads
      conversion tracking. Configure your IDs in ONE place:
        client/src/config/tracking.js   (or client/.env — see .env.example)
      Nothing to edit here. If no ID is configured yet, this block quietly
      does nothing — no external request is made and nothing breaks.
    -->
    <script>
      (function () {
        var GA_ID = "%VITE_GA_MEASUREMENT_ID%";
        var ADS_ID = "%VITE_GOOGLE_ADS_ID%";
        var isSet = function (v) { return v && v.indexOf('%') !== 0 && v.length > 3; };
        if (!isSet(GA_ID) && !isSet(ADS_ID)) return; // nothing configured — skip entirely

        window.dataLayer = window.dataLayer || [];
        function gtag() { window.dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag('js', new Date());

        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=' + (isSet(GA_ID) ? GA_ID : ADS_ID);
        document.head.appendChild(script);

        // send_page_view is disabled here because this is a single-page app —
        // React Router fires page_view manually on every route change
        // instead (see src/utils/analytics.js + the PageViewTracker in
        // src/App.jsx), which is the accurate way to track SPA navigation.
        if (isSet(GA_ID)) gtag('config', GA_ID, { send_page_view: false });
        if (isSet(ADS_ID)) gtag('config', ADS_ID);
      })();
    </script>

    <!--
      Meta (Facebook/Instagram) Pixel. Configure in the same place as the
      Google tags above: client/src/config/tracking.js (or client/.env).
      Quietly does nothing if VITE_META_PIXEL_ID isn't set.
    -->
    <script>

        if (!PIXEL_ID || PIXEL_ID.indexOf('%') === 0 || PIXEL_ID.length < 3) return;

        !function (f, b, e, v, n, t, s) {
          if (f.fbq) return; n = f.fbq = function () {
            n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments)
          };
          if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0';
          n.queue = []; t = b.createElement(e); t.async = !0;
          t.src = v; s = b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t, s);
        }(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');

        window.fbq('init', PIXEL_ID);
        window.fbq('track', 'PageView');
        // Subsequent SPA route changes fire their own PageView from
        // src/utils/analytics.js (see PageViewTracker in src/App.jsx).
      })();
    </script>
